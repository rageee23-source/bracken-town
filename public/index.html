<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#171a1c"><title>Bracken • Town Observatory</title><link rel="stylesheet" href="/town.css"></head><body>
<header><div class="brand"><span class="seal" aria-hidden="true">♜</span><div><h1>Bracken</h1><p>Town observatory</p></div></div><div class="controls"><span id="state">Connecting</span><button id="pause" disabled>Pause town</button></div></header>
<main><section class="atlas"><div class="sectionhead"><h2>Town map</h2><span id="clock"></span></div><div id="map" aria-label="Map with ten selectable residents"><img src="/map.svg" alt="Illustrated map of Bracken’s nine places beside a river"><div id="pins"></div></div><div class="mapfoot"><span>● &nbsp; Select a resident to inspect</span><span>9 places · 10 residents</span></div></section>
<aside><div class="sectionhead"><h2>Residents</h2><span>10</span></div><div id="people"></div><section id="detail"></section></aside>
<section class="journal"><div class="sectionhead"><h2>Town chronicle</h2><select id="filter" aria-label="Filter chronicle"><option value="">Everyone</option></select></div><div id="events"></div></section><section class="meter"><h2>Market board</h2><div id="grid"></div><div id="market"></div><h2>Town hall</h2><p id="hall"></p><h2>Simulation</h2><p id="model"></p><p id="budget"></p><p id="error" role="status"></p><details><summary>Town facilities</summary><div id="facilities"></div></details></section></main><script src="/town.js"></script></body></html>
